model:
  repo_or_root: ${EDITMGT_MODEL_ROOT}
  transformer_subfolder: editmgt
  text_encoder_subfolder: text_encoder
  tokenizer_subfolder: tokenizer
  llm_encoder_subfolder: llm_encoder
  vqvae_subfolder: vqvae
  scheduler_subfolder: scheduler
data:
  name: fixed_200k
  manifest: ${DERIVED_ROOT}/fixed200k/train_200k.jsonl
  metadata: ${DERIVED_ROOT}/fixed200k/train_200k.meta.json
  corpus_ready: ${DERIVED_ROOT}/fixed200k/CORPUS_READY.json
  verify_hashes_at_read: true
  roots:
    magicbrush: ${MAGICBRUSH_ROOT}
    crispedit: ${CRISPEDIT_ROOT}
    scaleedit: ${SCALEEDIT_ROOT}
    interedit: ${INTEREDIT_ROOT}
  translation_cache: ${DERIVED_ROOT}/fixed200k/translation_cache.jsonl
  translation_config: configs/translation/nllb.yaml
  translation:
    backend: nllb
    repo: facebook/nllb-200-distilled-1.3B
    immutable_revision: ${TRANSLATOR_REVISION}
    src_lang: zho_Hans
    tgt_lang: eng_Latn
    decoding: {do_sample: false, num_beams: 1, max_new_tokens: 128}
output_dir: ${EDITMGT_OUTPUT_ROOT}/formal-placeholder
resolution: 1024
seed: 42
precision: bf16
component_dtypes: {transformer: bf16, text_encoders: bf16, vqvae: fp32}
torch_compile: false
gradient_checkpointing: true
batch_per_gpu: 1
gradient_accumulation: 4
num_workers: 4
epochs: 1
max_optimizer_steps: 6250
scheduler_horizon_steps: 6250
warmup_steps: 200
checkpoint_steps: [625, 1250, 1875, 2500, 3125, 3750, 4375, 5000, 5625, 6250]
condition_dropout: {enabled: true, probability: 0.1, scope: text_only}
validation:
  enabled: true
  protocol: fixed200k_magicbrush_probe
  interval_steps: 625
  inference_config: configs/eval/periodic_probe.yaml
  manifest: ${DERIVED_ROOT}/fixed200k/validation/magicbrush_probe128.jsonl
  dataset_root: ${MAGICBRUSH_DEV_ROOT}
quality_gate: {enabled: true, baseline_start: 101, baseline_end: 400, window_size: 50, max_loss_ratio: 1.75, consecutive_bad_windows: 2, max_abs_logit: 100.0, max_clip_fraction: 0.95, max_update_ratio: 0.1}
geometry: {max_resample_attempts: 8, minimum_mask_retention: 0.75}
token_mask: {mode: any_overlap, coverage_threshold: 0.5, dilation_tokens: 0, minimum_edit_tokens: 1}
corruption: {mode: roi_hardlock, roi_probability: 1.0, full_roi_mask_probability: 0.15, persistent_conditioning: true}
lora:
  scope: both
  rank: 64
  alpha: 64
  dropout: 0.05
  target_modules: [to_q, to_k, to_v, to_out.0, ff.net.2, proj_mlp, proj_out]
optimizer: {name: AdamW, learning_rate: 0.00003, betas: [0.9, 0.95], weight_decay: 0.01, gradient_clip: 1.0, scheduler: constant_with_warmup}
evaluation:
  generation_seeds: [0, 1, 2, 3]
  bootstrap_seed: 42
  bootstrap_resamples: 10000
