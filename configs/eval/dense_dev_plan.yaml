  - name: crispedit
    manifest: ${DENSE_CRISPEDIT_AUX_MANIFEST}
    root: ${CRISPEDIT_ROOT}
    scope: auxiliary
  - name: scaleedit
    manifest: ${DENSE_SCALEEDIT_AUX_MANIFEST}
    root: ${SCALEEDIT_ROOT}
