teacher_checkpoint: ${MB_EXPERIMENT_ROOT}/selected_teacher
formal_ready: false
upstream_reference_commit: 24613741ec9ca730273a6ebc822327878d5a086b
model:
  repo_or_root: ${EDITMGT_MODEL_ROOT}
  resolution: 1024
resolution: 1024
precision: bf16
gradient_checkpointing: true
model_roles:
  backend: full_dense
  student_trainable_scope: full_transformer_and_region
  auxiliary_trainable_scope: full_transformer_and_region
  lora_dropout_policy: zero_for_dimo
  student_lora_dropout: 0.0
  auxiliary_lora_dropout: 0.0
  teacher_lora_dropout: inherit
  lora: false
initialization:
  mask_ratio: 1.0
  random_tokens_inside_roi: false
embedding_perturbation:
  enabled: true
  sigma: 0.3
  scope: target_roi_only
distillation:
  mode: FKL
  jeffreys_beta: 0.5
  teacher_temperature: 1.0
  auxiliary_temperature: 1.0
  teacher_cfg: 1.0
  auxiliary_cfg: 1.0
pseudo_forward:
  teacher_ratio_mode: cosine
  auxiliary_ratio_mode: cosine
  ratio_min: 0.02
  ratio_max: 0.98
auxiliary:
  updates_per_student: 1
  batch_policy: same_batch
  soft_target_weight: 0.0
sampling:
  temperature: 1.0
  top_k: 0
  top_p: 0.0
ema:
  enabled: true
  decay: 0.9995
  device: cuda
gt_anchor:
  weight: 0.0
seed: 43
max_optimizer_steps: 22000
validation: false
optimizer:
  name: AdamW
  student_learning_rate: 1.0e-06
  auxiliary_learning_rate: 1.0e-06
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  scheduler: constant
  warmup_steps: 0
  horizon_steps: 22000
experiment: Full-DenseDiMO-MagicBrush-4A800-10Epoch
teacher_backend: dense
distributed:
  backend: ddp
  world_size: 4
  timeout_seconds: 600
  control_timeout_seconds: 7200
component_dtypes:
  teacher: fp32
  student: fp32
  auxiliary: fp32
  gradients: fp32
  adamw_moments: fp32
  ema: fp32
  forward: bf16_autocast
surrogate:
  implementation: linear
  version: roi-vocabulary-sum-v1
epochs: 10
batch_per_gpu: 1
gradient_accumulation: 1
diagnostic_interval: 100
resume_checkpoint_steps:
- 2200
- 6600
- 11000
- 15400
- 22000
evaluation_steps:
- 0
- 2200
- 6600
- 11000
- 15400
- 22000
monitor:
  interval: 500
  assets:
  - loss
  - gradient
output_dir: ${MB_EXPERIMENT_ROOT}/dimo/train
token_mask:
  mode: any_overlap
  coverage_threshold: 0.5
  dilation_tokens: 0
  minimum_edit_tokens: 1
geometry:
  max_resample_attempts: 8
  minimum_mask_retention: 0.75
num_workers: 0
parity:
  atol: 1.0e-05
  rtol: 1.0e-05
evaluation:
  plan: ${MB_EXPERIMENT_ROOT}/evaluation_plan.json
experiment_mode: magicbrush_exploratory
data:
  name: fixed_magicbrush_train
  expected_rows: 8800
  manifest: ${MB_EXPERIMENT_ROOT}/data/train_8800.jsonl
  corpus_ready: ${MB_EXPERIMENT_ROOT}/data/MAGICBRUSH_READY.json
  verify_hashes_at_read: true
  roots:
    magicbrush: ${MB_EXPERIMENT_ROOT}/data/train
